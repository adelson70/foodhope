name: Deploy
run-name: ${{ github.event.head_commit.message || 'Deploy manual' }}

# Build e deploy no servidor de casa (runner self-hosted "foodhope-server", label "foodhope").
# O runner atualiza ~/apps/foodhope (onde estão o docker/.env e os volumes de produção),
# gera as imagens lá mesmo e recria só os containers cuja imagem mudou.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; o seguinte espera (não cancela um deploy no meio).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build e deploy
    runs-on: [self-hosted, foodhope]
    timeout-minutes: 30
    env:
      APP_DIR: /home/dev/apps/foodhope
      SHA: ${{ github.sha }}
    steps:
      - name: Atualizar código em ~/apps/foodhope
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --quiet origin main
          git merge --ff-only "$SHA"
          git log --oneline -1

      - name: Build das imagens
        working-directory: /home/dev/apps/foodhope/docker
        run: |
          set -euo pipefail
          VITE_GIT_SHA="${SHA::7}" docker compose build api web

      - name: Subir
        working-directory: /home/dev/apps/foodhope/docker
        run: |
          set -euo pipefail
          docker compose up -d --remove-orphans
          docker compose ps

      - name: Verificar
        working-directory: /home/dev/apps/foodhope/docker
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:5000/health && break
            if [ "$i" -eq 60 ]; then
              docker compose logs --tail=120 api
              exit 1
            fi
            sleep 2
          done
          echo "API local OK"
          for url in https://foodhope-api.abjr.dev/health https://foodhope.abjr.dev/; do
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null "$url" && { echo "$url OK"; break; }
              [ "$i" -eq 30 ] && { echo "$url falhou"; exit 1; }
              sleep 3
            done
          done

      - name: Limpar imagens antigas
        if: success()
        run: docker image prune -f --filter "label=com.docker.compose.project=foodhope" >/dev/null || true
