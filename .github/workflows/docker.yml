name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/adelson70/foodhope-api
  IMAGE_WEB: ghcr.io/adelson70/foodhope-web

jobs:
  migrate:
    name: Migrations (deploy only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodhope
          POSTGRES_PASSWORD: foodhope
          POSTGRES_DB: foodhope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodhope -d foodhope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://foodhope:foodhope@localhost:5432/foodhope
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Guardrail — sem comandos destrutivos
        run: |
          set -e
          if grep -nE \
            -e 'prisma[[:space:]]+migrate[[:space:]]+reset' \
            -e 'prisma[[:space:]]+db[[:space:]]+push' \
            -e 'prisma[[:space:]]+migrate[[:space:]]+dev' \
            -e 'accept-data-loss' \
            docker-entrypoint.sh Dockerfile; then
            echo "Comando Prisma destrutivo ou de desenvolvimento encontrado no boot/imagem." >&2
            exit 1
          fi
          echo "Guardrail OK: apenas migrate deploy permitido no boot."

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma migrate status
        run: npx prisma migrate status

  api:
    needs: migrate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    needs: migrate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Resolve VITE_API_URL
        id: vite
        run: |
          url="${{ vars.VITE_API_URL }}"
          if [ -z "$url" ]; then
            echo "VITE_API_URL repository variable is required" >&2
            exit 1
          fi
          echo "value=$url" >> "$GITHUB_OUTPUT"

      - name: Resolve VITE_SITE_URL
        id: site
        run: |
          url="${{ vars.VITE_SITE_URL }}"
          if [ -z "$url" ]; then
            url="https://foodhope.abjr.dev"
          fi
          echo "value=$url" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ steps.vite.outputs.value }}
            VITE_SITE_URL=${{ steps.site.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
