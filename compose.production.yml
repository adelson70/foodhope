name: foodhope

services:
  api:
    image: ${API_IMAGE:-ghcr.io/adelson70/foodhope/api:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    group_add:
      - "${DIALOUT_GID:-20}"
      - "${LP_GID:-7}"
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
      - "c 180:* rmw"
      - "c 6:* rmw"
    volumes:
      - produto-imagens:/app/public/produto
      - /dev:/dev
    networks:
      - stack
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    image: ${WEB_IMAGE:-ghcr.io/adelson70/foodhope/web:latest}
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  produto-imagens:

networks:
  stack:
    name: stack_default
    external: true
  edge:
    name: foodhope_edge
    external: true
